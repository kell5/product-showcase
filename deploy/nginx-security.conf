# ============================================================
# 服务器安全配置（宝塔面板 / nginx）
# ------------------------------------------------------------
# 用法：宝塔面板 → 网站 → 设置 → 配置文件，
#      把下面的内容粘贴到 server { ... } 内部、其它 location 之前，
#      保存后 nginx 会自动重载。
#
# 为什么需要它：
#   仓库里的 data/.htaccess 用的是 Apache 语法（Deny from all），
#   nginx 完全不认这个文件，所以 data/products.json（含全部产品数据）
#   和 data/password.hash 默认是能直接被浏览器下载的。
# ============================================================

# 1) 数据目录一律拒绝直接访问
location ^~ /data/ {
    return 404;
}

# 2) uploads 只当静态图片用，禁止执行任何脚本
location ^~ /uploads/ {
    location ~* \.(php|php[0-9]?|phtml|pl|py|cgi|sh|asp|aspx|jsp|htaccess)$ {
        return 404;
    }
    expires 30d;
    add_header Cache-Control "public";
}

# 3) 禁止访问 .git / .env 等隐藏文件
location ~ /\.(?!well-known) {
    return 404;
}

# 4) 后台接口禁止被搜索引擎收录（配合 admin.html 的 noindex）
location = /api.php {
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# 5) 静态资源缓存（HTML 不缓存，方便改完立刻生效）
location ~* \.(css|js)$ {
    expires 7d;
    add_header Cache-Control "public";
}
location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|apk)$ {
    expires 30d;
    add_header Cache-Control "public";
}
