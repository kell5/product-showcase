name: 🚀 自动部署到服务器

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🧪 PHP 语法检查
        run: |
          # 语法错就拦在部署前，别把 500 推到线上
          for f in $(find . -maxdepth 1 -name '*.php'); do
            php -l "$f" || exit 1
          done
          for f in $(find tools deploy -name '*.php' 2>/dev/null); do
            php -l "$f" || exit 1
          done

      - name: 🔑 加载 SSH 密钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚚 通过 rsync 同步到服务器
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.vscode' \
            --exclude='.claude' \
            --exclude='.reasonix' \
            --exclude='data/*.json' \
            --exclude='data/*.hash' \
            --exclude='data/*.php' \
            --exclude='data/.pwd-init' \
            --exclude='data/*.tmp*' \
            --exclude='uploads/' \
            --exclude='downloads/*.apk' \
            --exclude='nginx-config-snippet.conf' \
            --exclude='deploy/' \
            --exclude='docs/' \
            --exclude='tools/' \
            --exclude='*.zip' \
            --exclude='.gitignore' \
            --exclude='.github/' \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || '22' }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/wwwroot/114.55.208.72/

      - name: ✅ 设置文件权限
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd /www/wwwroot/114.55.208.72

            # 首次部署写入初始后台密码（只执行一次，之后由 data/.pwd-init 挡住）。
            # 这里写的是 sha256 哈希，登录成功后 api.php 会自动升级成 bcrypt。
            # 登录后台第一件事就是改密码，改完这个初始化块可以删掉。
            if [ ! -f data/.pwd-init ]; then
              mkdir -p data
              printf '%s' "<?php return '3c2ab075af76bb3d411a1de921026578b56470a5f3f60ae852704acbe4df70a7';" > data/password.php
              touch data/.pwd-init
              echo "→ 已写入初始后台密码"
            fi

            chmod -R 755 .
            find . -maxdepth 1 -name '*.html' -exec chmod 644 {} \;
            find . -maxdepth 1 -name '*.php' -exec chmod 644 {} \;
            # rsync 以 root 身份建目录，data/ 会变成 root 属主，
            # PHP-FPM 用户（宝塔默认 www）就写不进新文件了 —— 接口会报
            # "Failed to open stream"。这里把 data/ 交给 web 用户。
            if [ -d data ]; then
              chown -R www:www data 2>/dev/null || true
              chmod 775 data
              find data -maxdepth 1 -type f -exec chmod 664 {} \; 2>/dev/null || true
            fi
            # 上传目录同理，否则后台传图会失败
            if [ -d uploads ]; then
              chown -R www:www uploads 2>/dev/null || true
              chmod -R 775 uploads
            fi
            echo "✅ 部署完成！"
