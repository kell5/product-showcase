name: 🚀 自动部署到服务器

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🔑 加载 SSH 密钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚚 通过 rsync 同步到服务器
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.vscode' \
            --exclude='.claude' \
            --exclude='.reasonix' \
            --exclude='data/*.json' \
            --exclude='data/*.hash' \
            --exclude='data/*.tmp*' \
            --exclude='uploads/' \
            --exclude='downloads/*.apk' \
            --exclude='nginx-config-snippet.conf' \
            --exclude='*.zip' \
            --exclude='.gitignore' \
            --exclude='.github/' \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || '22' }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/wwwroot/114.55.208.72/

      - name: ✅ 设置文件权限
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd /www/wwwroot/114.55.208.72
            chmod -R 755 .
            find . -maxdepth 1 -name '*.html' -exec chmod 644 {} \;
            find . -maxdepth 1 -name '*.php' -exec chmod 644 {} \;
            # data/ 里的运行时文件由 PHP-FPM 用户写入，属主通常不是 root。
            # 这里不能收紧到 640，否则 PHP 读不到 products.json 会导致接口返回空。
            # 对外开放的拦截交给 nginx（见 deploy/nginx-security.conf）。
            if [ -d data ]; then
              find data -name '*.json' -exec chmod 644 {} \;
              find data -name '*.hash' -exec chmod 644 {} \;
            fi
            echo "✅ 部署完成！"
