<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>CrabGuard 配置页</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1000px; height: 640px; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: radial-gradient(ellipse 90% 90% at 88% 0%, #E3EDFF 0%, #F4F7FC 58%);
    color: #0D1A2E; padding: 34px 40px;
  }
  .bar { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .dot { width: 34px; height: 34px; border-radius: 11px;
    background: linear-gradient(135deg, #5C97F2, #1E48A8); position: relative; }
  .dot::after { content: ""; position: absolute; inset: 10px 11px auto 11px;
    height: 6px; border-radius: 3px; background: #9FD2FF; box-shadow: 0 9px 0 -1px #6FB6F7; }
  h1 { font-size: 19px; letter-spacing: .2px; }
  .sub { font-size: 12px; color: #6B7C97; margin-top: 3px; }
  .pill { margin-left: auto; font-size: 12px; color: #166B3F; background: #E4F6EC;
    border: 1px solid #BFE8D2; padding: 6px 13px; border-radius: 999px; }
  .pill i { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #21A566; margin-right: 6px; vertical-align: 1px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #fff; border: 1px solid #E1E8F3; border-radius: 16px;
    padding: 20px 22px; box-shadow: 0 10px 24px rgba(13, 26, 46, .05); }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 13px; font-weight: 700; color: #38507A;
    letter-spacing: .06em; margin-bottom: 16px; }

  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .row:last-child { margin-bottom: 0; }
  .row label { font-size: 13.5px; color: #33425C; width: 84px; flex: none; }
  .track { flex: 1; height: 6px; border-radius: 4px; background: #E8EEF8; position: relative; }
  .track b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px;
    background: linear-gradient(90deg, #5C97F2, #2B62D9); }
  .track s { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    background: #fff; border: 3px solid #2B62D9; border-radius: 50%;
    box-shadow: 0 2px 6px rgba(43, 98, 217, .3); }
  .val { font-size: 13px; font-weight: 700; color: #2B62D9; width: 52px; text-align: right; flex: none; }

  .switch { width: 42px; height: 24px; border-radius: 999px; background: #2B62D9;
    position: relative; flex: none; margin-left: auto; }
  .switch.off { background: #D4DDEB; }
  .switch i { position: absolute; top: 3px; left: 21px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.off i { left: 3px; }

  .field { flex: 1; height: 36px; border: 1px solid #DCE5F2; border-radius: 9px;
    background: #FAFCFF; font-size: 12.5px; color: #38507A;
    display: flex; align-items: center; padding: 0 12px; letter-spacing: .1px; }
  .field.dim { color: #8B9AB4; letter-spacing: 3px; }
  .foot { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  .foot span { font-size: 12px; color: #7A8AA5; }
  .btn { margin-left: auto; background: linear-gradient(135deg, #5C97F2, #1E48A8);
    color: #fff; font-size: 13px; font-weight: 700; padding: 11px 26px; border-radius: 10px;
    box-shadow: 0 8px 18px rgba(43, 98, 217, .28); }
</style>
</head>
<body>
  <div class="bar">
    <div class="dot"></div>
    <div>
      <h1>CrabGuard · 洗手监督小助手</h1>
      <div class="sub">设备设置 · 手机连上同一 Wi-Fi 打开 192.168.4.1 即可修改</div>
    </div>
    <div class="pill"><i></i>设备在线 · 固件 v1.2.0</div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>检测与提醒</h2>
      <div class="row">
        <label>触发距离</label>
        <div class="track"><b style="width:46%"></b><s style="left:46%"></s></div>
        <div class="val">15 cm</div>
      </div>
      <div class="row">
        <label>洗手时长</label>
        <div class="track"><b style="width:66%"></b><s style="left:66%"></s></div>
        <div class="val">20 s</div>
      </div>
      <div class="row">
        <label>音量</label>
        <div class="track"><b style="width:60%"></b><s style="left:60%"></s></div>
        <div class="val">60 %</div>
      </div>
    </div>

    <div class="card">
      <h2>播放与联动</h2>
      <div class="row">
        <label style="width:auto">人一靠近中断播放</label>
        <div class="switch"><i></i></div>
      </div>
      <div class="row">
        <label style="width:auto">离开后语音催回</label>
        <div class="switch"><i></i></div>
      </div>
      <div class="row">
        <label style="width:auto">夜间静音</label>
        <div class="switch off"><i></i></div>
      </div>
    </div>

    <div class="card wide">
      <h2>AI 接口</h2>
      <div class="row">
        <label>接口地址</label>
        <div class="field">https://api.your-domain.com/v1/chat</div>
      </div>
      <div class="row">
        <label>密钥</label>
        <div class="field dim">••••••••••••••••••</div>
      </div>
    </div>
  </div>

  <div class="foot">
    <span>HC-SR04 · 159 mm　|　电池 3.84 V　|　运行 3 h 12 min</span>
    <div class="btn">保存并下发</div>
  </div>
</body>
</html>
